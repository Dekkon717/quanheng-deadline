<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" rx="28" fill="#1f2926"/>
  <text x="60" y="72" font-size="20" fill="#db8a70" font-family="Arial">CALCULATION WITH LEGAL TRACEABILITY</text>
  <text x="60" y="116" font-size="36" font-weight="700" fill="#fff" font-family="Arial, Microsoft YaHei">不是“日期加减器”，而是有边界的法律规则引擎</text>
  <g font-family="Arial, Microsoft YaHei" text-anchor="middle">
    <g><rect x="60" y="170" width="220" height="150" rx="22" fill="#fff"/><text x="170" y="222" font-size="22" font-weight="700" fill="#1f2926">① 识别期限性质</text><text x="170" y="262" font-size="17" fill="#68736f">诉讼时效 / 除斥期间</text><text x="170" y="290" font-size="17" fill="#68736f">程序期限 / 不适用时效</text></g>
    <text x="310" y="250" font-size="30" fill="#db8a70">→</text>
    <g><rect x="340" y="170" width="220" height="150" rx="22" fill="#fff"/><text x="450" y="222" font-size="22" font-weight="700" fill="#1f2926">② 填写法定事实</text><text x="450" y="262" font-size="17" fill="#68736f">起算点 / 最长期间</text><text x="450" y="290" font-size="17" fill="#68736f">新旧法施行日期</text></g>
    <text x="590" y="250" font-size="30" fill="#db8a70">→</text>
    <g><rect x="620" y="170" width="220" height="150" rx="22" fill="#fff"/><text x="730" y="222" font-size="22" font-weight="700" fill="#1f2926">③ 风险门控</text><text x="730" y="262" font-size="17" fill="#68736f">争议 / 中止 / 多次中断</text><text x="730" y="290" font-size="17" fill="#68736f">复杂即停止自动计算</text></g>
    <text x="870" y="250" font-size="30" fill="#db8a70">→</text>
    <g><rect x="900" y="170" width="240" height="150" rx="22" fill="#c35a3d"/><text x="1020" y="222" font-size="22" font-weight="700" fill="#fff">④ 计算参考</text><text x="1020" y="262" font-size="17" fill="#fbe9e3">届满日＋计算轨迹</text><text x="1020" y="290" font-size="17" fill="#fbe9e3">法条原文＋风险提示</text></g>
  </g>
  <text x="60" y="375" font-size="18" fill="#b9c3bf" font-family="Arial, Microsoft YaHei">原则：没有明确法律文件，就不自动计算；不以案例代替成文法创设期限。</text>
</svg>
